{% extends 'admin/base.html' %}

{% load static %}

{% block extrahead %}
    {{ block.super }}
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
{% endblock %}

{% block extrastyle %}
    {{ block.super }}
    <!-- Custom admin styles load after Jazzmin/Bootstrap. -->
    <link rel="stylesheet" href="{% static 'admin/css/custom_admin.css' %}">
    <!-- Final light-theme compatibility overrides. -->
    <link rel="stylesheet" href="{% static 'admin/css/admin_theme_fix.css' %}">
    <style>
        html[data-bs-theme="light"],
        html[data-bs-theme="light"] body {
            color-scheme: light;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif !important;
        }
    </style>
{% endblock %}

{% block footer %}
    {{ block.super }}
    <script src="{% static 'js/admin-custom.js' %}"></script>
{% endblock %}
