{% extends "admin/change_form.html" %}

{% block extrahead %}
    {{ block.super }}
    <style>
        .pqr-request-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 16px;
        }
        .pqr-request-actions button,
        .pqr-request-actions a {
            width: 100%;
            min-height: 40px;
            box-sizing: border-box;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 9px 20px;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            text-decoration: none !important;
            cursor: pointer;
            transition: background-color 160ms ease, border-color 160ms ease, transform 160ms ease;
        }
        .pqr-request-actions button:hover,
        .pqr-request-actions a:hover {
            transform: translateY(-1px);
        }
        .pqr-request-actions .accept {
            background: #052e16;
            color: #4ade80;
            border: 1px solid #166534;
        }
        .pqr-request-actions .accept:hover {
            background: #14532d;
            border-color: #22c55e;
        }
        .pqr-request-actions .reject {
            background: #450a0a;
            color: #f87171;
            border: 1px solid #7f1d1d;
        }
        .pqr-request-actions .reject:hover {
            background: #7f1d1d;
            border-color: #ef4444;
        }
        .pqr-request-actions .back {
            background: #111827;
            color: #cbd5e1 !important;
            border: 1px solid #334155;
        }
        .pqr-request-actions .back:hover {
            background: #1e293b;
            border-color: #475569;
        }
    </style>
{% endblock %}

{% block submit_buttons_bottom %}
<div class="submit-row pqr-request-actions">

    {% if original.statut == 'en_attente' %}

        <button type="submit" name="_accepter" value="1" class="accept">
            ✅ Accepter
        </button>

        <button type="submit" name="_refuser" value="1" class="reject">
            ❌ Refuser
        </button>

    {% endif %}

    {# Toujours visible #}
    <a href="../../" class="back">
        ← Retour
    </a>

</div>
{% endblock %}

{% block object_tools_items %}{% endblock %}
