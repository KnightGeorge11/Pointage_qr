name: Apply CI contract fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix source contracts
        shell: python
        run: |
          from pathlib import Path

          # Make RH correction failure-safe even when the treatment service
          # raises an unexpected exception after form.save().
          for filename in ('pointage/views.py', 'pointage/admin.py'):
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              old = "            except (ValueError, PermissionError) as e:\n                messages.error(request, f\"❌ {e}\")"
              new = "            except (ValueError, PermissionError) as e:\n                messages.error(request, f\"❌ {e}\")\n            except Exception as e:\n                transaction.set_rollback(True)\n                messages.error(request, \"❌ Le traitement de la correction a échoué. Aucune modification n'a été enregistrée.\")"
              if filename == 'pointage/admin.py':
                  old = "            except (ValueError, PermissionError) as e:\n                self.message_user(request, f\"❌ {e}\", level=messages.ERROR)"
                  new = "            except (ValueError, PermissionError) as e:\n                self.message_user(request, f\"❌ {e}\", level=messages.ERROR)\n            except Exception:\n                transaction.set_rollback(True)\n                self.message_user(request, \"❌ Le traitement de la correction a échoué. Aucune modification n'a été enregistrée.\", level=messages.ERROR)"
              if old in text and new not in text:
                  text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          # Fix regression test imports and make the rollback test use the
          # deliberate uncaught failure path only if production changes later.
          p = Path('pointage/tests/test_anomalie_correction_admin.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              "    AnomaliePointage, CustomUser, Employe, Site, Pointage,\n)",
              "    AnomaliePointage, AnomalieTraitement, CustomUser, Employe, Site, Pointage,\n)",
              1,
          )
          p.write_text(text, encoding='utf-8')

      - name: Validate
        run: |
          python -m compileall -q pointage

      - name: Commit source fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pointage
          git diff --cached --quiet || git commit -m "fix: complete CI contract corrections"
          git push

      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/fix_ci_contracts.yml
          git commit -m "chore: remove temporary CI fix workflow"
          git push
