name: Apply RH atomicity refactor

on:
  push:
    paths:
      - '.github/workflows/refactor_rh_atomicity.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch correction workflows
        run: |
          python - <<'PY'
          from pathlib import Path

          # views.py: make the complete RH anomaly correction request atomic.
          p = Path('pointage/views.py')
          s = p.read_text(encoding='utf-8')
          if 'from django.db import transaction' not in s:
              s = s.replace('from django.db.models import Q, Count\n', 'from django.db import transaction\nfrom django.db.models import Q, Count\n', 1)
          old = '''@login_required\n@staff_member_required\ndef alerte_detail_view(request, pk):'''
          new = '''@login_required\n@staff_member_required\n@transaction.atomic\ndef alerte_detail_view(request, pk):'''
          if old in s and new not in s:
              s = s.replace(old, new, 1)
          old_qs = '''            pointage_existant = Pointage.objects.filter(\n                employe_id=employe_id, date_pointage=date_pointage, periode=periode\n            ).first()'''
          new_qs = '''            pointage_existant = Pointage.objects.select_for_update().filter(\n                employe_id=employe_id, date_pointage=date_pointage, periode=periode\n            ).first()'''
          if old_qs in s:
              s = s.replace(old_qs, new_qs, 1)
          p.write_text(s, encoding='utf-8')

          # admin.py: same atomic boundary for the dedicated admin correction URL.
          p = Path('pointage/admin.py')
          s = p.read_text(encoding='utf-8')
          if 'from django.db import transaction' not in s:
              s = s.replace('from django.contrib import messages\n', 'from django.contrib import messages\nfrom django.db import transaction\n', 1)
          old = '''    def corriger_pointage_view(self, request, anomalie_id):'''
          new = '''    @transaction.atomic\n    def corriger_pointage_view(self, request, anomalie_id):'''
          if old in s and new not in s:
              s = s.replace(old, new, 1)
          old_qs = '''            pointage_existant = Pointage.objects.filter(\n                employe_id=employe_id, date_pointage=date_pointage, periode=periode\n            ).first()'''
          new_qs = '''            pointage_existant = Pointage.objects.select_for_update().filter(\n                employe_id=employe_id, date_pointage=date_pointage, periode=periode\n            ).first()'''
          if old_qs in s:
              s = s.replace(old_qs, new_qs, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Add regression tests for rollback
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pointage/tests/test_anomalie_correction_admin.py')
          s = p.read_text(encoding='utf-8')
          if 'test_correction_est_rollback_si_traitement_anomalie_echoue' not in s:
              addition = r'''

    def test_correction_est_rollback_si_traitement_anomalie_echoue(self):
        """Le pointage ne doit pas rester modifié si le traitement RH échoue.
        La vue est transactionnelle : save() et marquer_traitee() doivent
        réussir ensemble ou être annulés ensemble."""
        from unittest.mock import patch

        pointage = Pointage.objects.create(
            employe=self.employe, site=self.site, date_pointage=date.today(),
            periode='matin', type_journee='normal', heure_arrivee=dtime(8, 0),
        )
        anomalie = enregistrer_anomalie(
            AnomaliePointage.TYPE_MISSING_MORNING_EXIT, message="x",
            employe=self.employe, site=self.site, date_pointage=date.today(),
        )

        with patch('pointage.admin.marquer_traitee', side_effect=ValueError('échec simulé')):
            response = self.client.post(self._url(anomalie), {
                'employe': self.employe.id, 'site': self.site.id,
                'date_pointage': date.today().isoformat(), 'periode': 'matin',
                'type_journee': 'normal', 'heure_arrivee': '08:00', 'heure_depart': '12:05',
                'statut': 'present', 'notes': '',
                'commentaire': 'Correction test rollback.',
            }, follow=True)

        assert response.status_code == 200
        pointage.refresh_from_db()
        assert pointage.heure_depart is None
        anomalie.refresh_from_db()
        assert anomalie.statut == AnomaliePointage.STATUT_OUVERTE
        assert not hasattr(anomalie, 'traitement') or not AnomaliePointage.objects.filter(pk=anomalie.pk, statut=AnomaliePointage.STATUT_TRAITEE).exists()
'''
              marker = '\n\n    def test_process_scan_reste_inchange_par_ce_flux(self):'
              if marker in s:
                  s = s.replace(marker, addition + marker, 1)
              else:
                  s += addition
              p.write_text(s, encoding='utf-8')
          PY

      - name: Validate syntax and Django checks
        run: |
          python -m compileall -q pointage

      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pointage/views.py pointage/admin.py pointage/tests/test_anomalie_correction_admin.py
          git diff --cached --check
          git commit -m 'fix: make RH anomaly corrections atomic'
          git push

      - name: Remove temporary patch workflow
        run: |
          git rm .github/workflows/refactor_rh_atomicity.yml
          git commit -m 'chore: remove temporary refactor workflow'
          git push
