name: Fix overnight guard filters
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch filters
        shell: python
        run: |
          from pathlib import Path
          p = Path('pointage/views.py')
          s = p.read_text(encoding='utf-8')
          old = """        JOURS_FR = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche']\n\n        qs = Pointage.objects.filter(\n            date_pointage__gte=date_debut,\n            date_pointage__lte=date_fin\n        ).select_related('employe', 'site', 'employe__poste').order_by(\n"""
          new = """        JOURS_FR = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche']\n\n        # Une garde de nuit peut chevaucher deux dates : date_pointage est le début\n        # et date_depart la fin. On retient donc toute garde qui chevauche l'intervalle.\n        qs = Pointage.objects.filter(\n            Q(periode='nuit', date_pointage__lte=date_fin)\n            & (Q(date_depart__isnull=True) | Q(date_depart__gte=date_debut))\n            | Q(~Q(periode='nuit'), date_pointage__gte=date_debut, date_pointage__lte=date_fin)\n        ).select_related('employe', 'site', 'employe__poste').order_by(\n"""
          if old not in s: raise SystemExit('export filter snippet not found')
          s = s.replace(old, new, 1)
          old = """        if date_debut:\n            queryset = queryset.filter(date_pointage__gte=date_debut)\n        if date_fin:\n            queryset = queryset.filter(date_pointage__lte=date_fin)\n"""
          new = """        if date_debut or date_fin:\n            debut = date_debut or date.min\n            fin = date_fin or date.max\n            queryset = queryset.filter(\n                Q(periode='nuit', date_pointage__lte=fin)\n                & (Q(date_depart__isnull=True) | Q(date_depart__gte=debut))\n                | Q(~Q(periode='nuit'), date_pointage__gte=debut, date_pointage__lte=fin)\n            )\n"""
          if old not in s: raise SystemExit('history filter snippet not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pointage/views.py
          git commit -m "fix: include overnight guards in history and Excel export" || true
          git rm .github/workflows/fix-overnight-filters.yml
          git commit -m "chore: remove temporary overnight filter workflow"
          git push