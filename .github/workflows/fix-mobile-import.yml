name: Fix mobile permission import

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add IsAdminUser import
        shell: python
        run: |
          from pathlib import Path
          p = Path('pointage/views_mobile.py')
          text = p.read_text(encoding='utf-8')
          old = 'from rest_framework.permissions import AllowAny, IsAuthenticated'
          new = 'from rest_framework.permissions import AllowAny, IsAuthenticated, IsAdminUser'
          if text.count(old) != 1:
              raise SystemExit(f'expected import once, found {text.count(old)}')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pointage/views_mobile.py
          git commit -m "Fix mobile admin permission import"
          git push
          git rm .github/workflows/fix-mobile-import.yml
          git commit -m "Remove temporary mobile import workflow"
          git push
