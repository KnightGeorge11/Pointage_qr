name: Build application mobile Android

on:
  push:
    branches: [main]
    paths:
      - "mobile/ScanMobileApp/**"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile/ScanMobileApp

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/ScanMobileApp/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le projet Android Expo
        run: npx expo prebuild --platform android --no-install

      - name: Construire l'APK Android
        working-directory: mobile/ScanMobileApp/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: PointageQR-Android-debug
          path: mobile/ScanMobileApp/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
