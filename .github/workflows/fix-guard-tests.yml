name: Align guard tests with planning
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Update guard tests
        shell: python
        run: |
          from pathlib import Path
          p = Path('pointage/tests/test_garde_minuit.py')
          s = p.read_text(encoding='utf-8')

          old = '''    def _debut_garde(self, jour, hh, mm):
        now = _aware(jour, hh, mm)
        with __import__('unittest.mock', fromlist=['patch']).patch('pointage.services.timezone.now', return_value=now):
            return process_scan(
                matricule=self.employe.matricule,
                qr_token=str(self.employe.qr_code_token),
                site_id=self.site.id, mode='garde',
            )'''
          new = '''    def _planifier_garde(self, jour):
        return Pointage.objects.create(
            employe=self.employe, site=self.site, date_pointage=jour,
            periode='nuit', type_journee='garde', heure_arrivee=None,
            heure_depart=None, statut='absent',
        )

    def _debut_garde(self, jour, hh, mm):
        # Depuis l'audit, une garde doit être planifiée explicitement.
        if not Pointage.objects.filter(
            employe=self.employe, date_pointage=jour, periode='nuit',
            type_journee='garde', heure_arrivee__isnull=True, heure_depart__isnull=True
        ).exists():
            self._planifier_garde(jour)
        now = _aware(jour, hh, mm)
        with __import__('unittest.mock', fromlist=['patch']).patch('pointage.services.timezone.now', return_value=now):
            return process_scan(
                matricule=self.employe.matricule,
                qr_token=str(self.employe.qr_code_token),
                site_id=self.site.id, mode='garde',
            )'''
          assert s.count(old) == 1
          s = s.replace(old, new)

          old = '''    def test_force_new_ignore_une_garde_oubliee_dun_jour_precedent(self):
        """
        Usage prévu de force_new : une garde d'un jour PRÉCÉDENT, jamais
        fermée (oubliée), ne doit pas empêcher de démarrer une garde
        aujourd'hui. force_new l'ignore et une nouvelle garde est créée.
        """'''
          new = '''    def test_force_new_refuse_si_une_garde_anterieure_reste_ouverte(self):
        """
        Une garde oubliée d'un jour précédent ne doit jamais être ignorée
        silencieusement par force_new : cela créerait plusieurs gardes ouvertes
        et rendrait la clôture ambiguë. L'opérateur doit faire corriger la garde.
        """'''
          assert s.count(old) == 1
          s = s.replace(old, new)

          old = '''        assert result['status'] == 'success'
        assert result['code'] == 'debut_garde'
        assert Pointage.objects.filter(employe=self.employe, periode='nuit').count() == 2
        # La garde oubliée reste ouverte (non touchée par force_new)
        vieille = Pointage.objects.get(employe=self.employe, periode='nuit', date_pointage=avant_hier)
        assert vieille.heure_depart is None'''
          new = '''        assert result['status'] == 'warning'
        assert result['code'] == 'GARDE_PRECEDENTE_NON_CLOTUREE'
        assert Pointage.objects.filter(employe=self.employe, periode='nuit').count() == 1
        vieille = Pointage.objects.get(employe=self.employe, periode='nuit', date_pointage=avant_hier)
        assert vieille.heure_depart is None'''
          assert s.count(old) == 1
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/fix-guard-tests.yml').unlink()
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pointage/tests/test_garde_minuit.py .github/workflows/fix-guard-tests.yml
          git diff --cached --quiet && exit 0
          git commit -m "Align guard tests with explicit planning"
          git push origin main
