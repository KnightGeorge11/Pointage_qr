name: Fix overnight history v4
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch history overlap filter
        shell: python
        run: |
          from pathlib import Path
          p = Path('pointage/views.py')
          s = p.read_text(encoding='utf-8')
          old = """        if date_debut:\n            queryset = queryset.filter(\n                Q(date_pointage__gte=date_debut) | Q(periode='nuit', date_depart__gte=date_debut)\n            )\n        if date_fin:\n            queryset = queryset.filter(\n                Q(date_pointage__lte=date_fin) | Q(periode='nuit', date_depart__lte=date_fin)\n            )\n"""
          new = """        if date_debut and date_fin:\n            # Un pointage de nuit chevauche la période si son début est avant la fin\n            # et sa fin est après le début (ou reste encore ouvert).\n            queryset = queryset.filter(\n                Q(\n                    periode='nuit',\n                    date_pointage__lte=date_fin,\n                ) & (\n                    Q(date_depart__isnull=True) | Q(date_depart__gte=date_debut)\n                )\n                | Q(\n                    ~Q(periode='nuit'),\n                    date_pointage__gte=date_debut,\n                    date_pointage__lte=date_fin,\n                )\n            )\n        elif date_debut:\n            queryset = queryset.filter(\n                Q(periode='nuit') & (\n                    Q(date_depart__isnull=True) | Q(date_depart__gte=date_debut)\n                )\n                | Q(~Q(periode='nuit'), date_pointage__gte=date_debut)\n            )\n        elif date_fin:\n            queryset = queryset.filter(\n                Q(periode='nuit', date_pointage__lte=date_fin)\n                | Q(~Q(periode='nuit'), date_pointage__lte=date_fin)\n            )\n"""
          if old not in s:
              raise SystemExit('current history filter snippet not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pointage/views.py
          git commit -m "fix: correct overnight history overlap filtering" || true
          git rm .github/workflows/fix-overnight-history-v4.yml
          git commit -m "chore: remove temporary history workflow"
          git push