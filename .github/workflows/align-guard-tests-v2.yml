name: Align guard tests v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch tests
        shell: python
        run: |
          from pathlib import Path
          p=Path('pointage/tests/test_garde_minuit.py'); s=p.read_text()
          marker='    def _debut_garde(self, jour, hh, mm):\n'
          helper='''    def _debut_garde(self, jour, hh, mm):\n        if not Pointage.objects.filter(employe=self.employe, date_pointage=jour, periode="nuit", type_journee="garde", heure_arrivee__isnull=True, heure_depart__isnull=True).exists():\n            Pointage.objects.create(employe=self.employe, site=self.site, date_pointage=jour, periode="nuit", type_journee="garde", statut="absent")\n'''
          if marker in s:
              start=s.index(marker); end=s.index('        now = _aware', start); s=s[:start]+helper+s[end:]
          old="""        assert result['status'] == 'success'\n        assert result['code'] == 'debut_garde'\n        assert Pointage.objects.filter(employe=self.employe, periode='nuit').count() == 2\n        # La garde oubliée reste ouverte (non touchée par force_new)\n        vieille = Pointage.objects.get(employe=self.employe, periode='nuit', date_pointage=avant_hier)\n        assert vieille.heure_depart is None"""
          new="""        assert result['status'] == 'warning'\n        assert result['code'] == 'GARDE_PRECEDENTE_NON_CLOTUREE'\n        assert Pointage.objects.filter(employe=self.employe, periode='nuit').count() == 1\n        vieille = Pointage.objects.get(employe=self.employe, periode='nuit', date_pointage=avant_hier)\n        assert vieille.heure_depart is None"""
          s=s.replace('def test_force_new_ignore_une_garde_oubliee_dun_jour_precedent','def test_force_new_refuse_si_une_garde_anterieure_reste_ouverte').replace(old,new)
          p.write_text(s)

          p=Path('pointage/tests/test_depart_anticipe.py'); s=p.read_text(); needle='        fake_now = _aware(self.today, 22, 0)\n'; repl='        Pointage.objects.create(employe=self.employe, site=self.site, date_pointage=self.today, periode="nuit", type_journee="garde", statut="absent")\n        fake_now = _aware(self.today, 22, 0)\n'; s=s.replace(needle,repl,1); p.write_text(s)

          p=Path('pointage/tests/test_pointage_serializer_process_scan.py'); s=p.read_text()
          s=s.replace('    def test_garde_via_api_pointages(self):\n        now = _aware','    def test_garde_via_api_pointages(self):\n        Pointage.objects.create(employe=self.employe, site=self.site, date_pointage=date(2026, 8, 10), periode="nuit", type_journee="garde", statut="absent")\n        now = _aware')
          s=s.replace('        jour1, jour2 = date(2026, 8, 10), date(2026, 8, 11)\n\n        with patch("pointage.services.timezone.now", return_value=_aware(jour1, 22, 0)):','        jour1, jour2 = date(2026, 8, 10), date(2026, 8, 11)\n        Pointage.objects.create(employe=self.employe, site=self.site, date_pointage=jour1, periode="nuit", type_journee="garde", statut="absent")\n\n        with patch("pointage.services.timezone.now", return_value=_aware(jour1, 22, 0)):')
          s=s.replace('        avant_hier = date(2026, 8, 8)\n        with patch("pointage.services.timezone.now", return_value=_aware(avant_hier, 20, 0)):','        avant_hier = date(2026, 8, 8)\n        Pointage.objects.create(employe=self.employe, site=self.site, date_pointage=avant_hier, periode="nuit", type_journee="garde", statut="absent")\n        with patch("pointage.services.timezone.now", return_value=_aware(avant_hier, 20, 0)):')
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix-guard-tests.yml .github/workflows/align-guard-tests-v2.yml
          git add pointage/tests/test_garde_minuit.py pointage/tests/test_depart_anticipe.py pointage/tests/test_pointage_serializer_process_scan.py
          git commit -m "Align guard tests with explicit planning"
          git push origin main
