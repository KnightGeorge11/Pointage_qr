name: Apply RH integrity fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply atomic correction and admin action fixes
        shell: python
        run: |
          from pathlib import Path

          views = Path('pointage/views.py')
          text = views.read_text(encoding='utf-8')

          if 'from django.db import transaction\n' not in text:
              text = text.replace('from django.db.models import Q, Count\n', 'from django.db import transaction\nfrom django.db.models import Q, Count\n', 1)

          old = '@login_required\n@staff_member_required\ndef alerte_detail_view(request, pk):'
          new = '@login_required\n@staff_member_required\n@transaction.atomic\ndef alerte_detail_view(request, pk):'
          if old in text and new not in text:
              text = text.replace(old, new, 1)

          old = """            pointage_existant = Pointage.objects.filter(\n                employe=anomalie.employe,\n                date_pointage=anomalie.date_pointage,\n                periode=periode,\n            ).first()"""
          new = """            pointage_existant = Pointage.objects.select_for_update().filter(\n                employe=anomalie.employe,\n                date_pointage=anomalie.date_pointage,\n                periode=periode,\n            ).first()"""
          if old in text:
              text = text.replace(old, new, 1)
          else:
              print('WARNING: expected alerte_detail pointage lookup not found')

          views.write_text(text, encoding='utf-8')

          admin = Path('pointage/admin.py')
          text = admin.read_text(encoding='utf-8')

          if 'from django.db import transaction\n' not in text:
              marker = 'from django.contrib import messages\n'
              text = text.replace(marker, marker + 'from django.db import transaction\n', 1)

          old = """    def marquer_present(self, request, queryset):\n        queryset.update(statut='present')\n        self.message_user(request, f\"✅ {queryset.count()} pointage(s) marqué(s) comme présent.\")"""
          new = """    @transaction.atomic\n    def marquer_present(self, request, queryset):\n        queryset = queryset.select_for_update()\n        count = queryset.count()\n        for pointage in queryset:\n            pointage.statut = 'present'\n            pointage.save()\n        self.message_user(request, f\"✅ {count} pointage(s) marqué(s) comme présent.\")"""
          if old in text:
              text = text.replace(old, new, 1)
          else:
              print('WARNING: marquer_present pattern not found')

          old = """    def marquer_retard(self, request, queryset):\n        queryset.update(statut='retard')\n        self.message_user(request, f\"⚠️ {queryset.count()} pointage(s) marqué(s) comme retard.\")"""
          new = """    @transaction.atomic\n    def marquer_retard(self, request, queryset):\n        queryset = queryset.select_for_update()\n        count = queryset.count()\n        for pointage in queryset:\n            pointage.statut = 'retard'\n            pointage.save()\n        self.message_user(request, f\"⚠️ {count} pointage(s) marqué(s) comme retard.\")"""
          if old in text:
              text = text.replace(old, new, 1)
          else:
              print('WARNING: marquer_retard pattern not found')

          old = """    def marquer_absent(self, request, queryset):\n        queryset.update(statut='absent')\n        self.message_user(request, f\"❌ {queryset.count()} pointage(s) marqué(s) comme absent.\")"""
          new = """    @transaction.atomic\n    def marquer_absent(self, request, queryset):\n        queryset = queryset.select_for_update()\n        count = queryset.count()\n        for pointage in queryset:\n            pointage.statut = 'absent'\n            pointage.save()\n        self.message_user(request, f\"❌ {count} pointage(s) marqué(s) comme absent.\")"""
          if old in text:
              text = text.replace(old, new, 1)
          else:
              print('WARNING: marquer_absent pattern not found')

          old = "    def corriger_pointage_view(self, request, anomalie_id):\n"
          new = "    @transaction.atomic\n    def corriger_pointage_view(self, request, anomalie_id):\n"
          if old in text and new not in text:
              text = text.replace(old, new, 1)

          old = "        anomalie = get_object_or_404(AnomaliePointage, pk=anomalie_id)\n"
          new = "        anomalie = get_object_or_404(AnomaliePointage.objects.select_for_update(), pk=anomalie_id)\n"
          # Only replace the occurrence belonging to corriger_pointage_view by targeting the nearby method block.
          marker = '    @transaction.atomic\n    def corriger_pointage_view(self, request, anomalie_id):\n'
          pos = text.find(marker)
          if pos >= 0:
              tail = text[pos:]
              if old in tail:
                  tail = tail.replace(old, new, 1)
                  text = text[:pos] + tail

          old = """        if pointage_existant:\n            form = PointageForm(request.POST or None, instance=pointage_existant)"""
          new = """        if pointage_existant:\n            pointage_existant = Pointage.objects.select_for_update().get(pk=pointage_existant.pk)\n            form = PointageForm(request.POST or None, instance=pointage_existant)"""
          if old in text:
              text = text.replace(old, new, 1)
          else:
              print('WARNING: admin correction existing-pointage pattern not found')

          admin.write_text(text, encoding='utf-8')

          test = Path('pointage/tests/test_anomalie_correction_admin.py')
          t = test.read_text(encoding='utf-8')
          if 'test_correction_rollback_si_traitement_echoue' not in t:
              t += '''\n\nclass TestAtomiciteCorrectionRH(TestCase):\n    """Une correction RH ne doit jamais être partiellement persistée.\n    Si le traitement de l'anomalie échoue après form.save(), le Pointage\n    et l'Anomalie doivent revenir exactement à leur état initial.\n    """\n\n    def setUp(self):\n        self.admin = CustomUser.objects.create_user(\n            username="admin_atomic", password="pass1234",\n            role="admin", is_staff=True, is_superuser=True,\n        )\n        self.employe = Employe.objects.create(\n            nom="Atomic", prenom="Test", matricule="AT001", actif=True,\n        )\n        self.site = Site.objects.create(\n            nom="Site Atomic", adresse="1 rue Atomic",\n            heure_ouverture_matin=dtime(8, 0), heure_fermeture_matin=dtime(12, 0),\n            heure_ouverture_apres_midi=dtime(13, 0), heure_fermeture_apres_midi=dtime(17, 0),\n        )\n        self.pointage = Pointage.objects.create(\n            employe=self.employe, site=self.site, date_pointage=date.today(),\n            periode='matin', type_journee='normal', heure_arrivee=dtime(8, 0),\n        )\n        self.anomalie = enregistrer_anomalie(\n            AnomaliePointage.TYPE_MISSING_MORNING_EXIT,\n            message="Sortie matin manquante", employe=self.employe,\n            site=self.site, date_pointage=date.today(),\n        )\n        self.client = Client()\n        self.client.force_login(self.admin)\n\n    def test_correction_rollback_si_traitement_echoue(self):\n        from unittest.mock import patch\n\n        url = reverse('admin:anomalie_corriger_pointage', args=[self.anomalie.pk])\n        with patch('pointage.admin.marquer_traitee', side_effect=RuntimeError('echec traitement')):\n            self.client.post(url, {\n                'employe': self.employe.id, 'site': self.site.id,\n                'date_pointage': date.today().isoformat(), 'periode': 'matin',\n                'type_journee': 'normal', 'heure_arrivee': '08:00',\n                'heure_depart': '12:00', 'statut': 'present', 'notes': '',\n                'commentaire': 'Correction test transactionnelle.',\n            })\n\n        self.pointage.refresh_from_db()\n        self.anomalie.refresh_from_db()\n        assert self.pointage.heure_depart is None\n        assert self.anomalie.statut == AnomaliePointage.STATUT_OUVERTE\n        assert not AnomalieTraitement.objects.filter(\n            anomalie=self.anomalie\n        ).exists()\n'''
              test.write_text(t, encoding='utf-8')

      - name: Validate Python syntax
        run: python -m compileall -q pointage

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pointage/views.py pointage/admin.py pointage/tests/test_anomalie_correction_admin.py
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix: make RH pointage corrections atomic"
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/apply_rh_integrity_fix.yml
          git commit -m "chore: remove temporary RH fix workflow"
          git push
