name: Temporary hardening patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic hardening fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          # Remove a no-op branch left in overtime/late-arrival calculation.
          path = Path('pointage/models.py')
          text = path.read_text(encoding='utf-8')
          old = '''            if self.periode == 'apres_midi':
                _, fermeture_matin = self.site.get_horaires_pour_periode('matin')
                if fermeture_matin:
                    pause_duree = datetime.combine(
                        self.date_pointage, heure_ouverture
                    ) - datetime.combine(
                        self.date_pointage, fermeture_matin
                    )
                    if pause_duree > timedelta(0):
                        retard_brut = retard_brut

'''
          if old in text:
              text = text.replace(old, '', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pointage/models.py
          git diff --cached --quiet || git commit -m 'refactor: remove no-op attendance calculation branch'
          git push
