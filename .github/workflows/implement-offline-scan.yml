name: Implement offline scan queue
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Patch backend
        shell: python
        run: |
          from pathlib import Path
          p=Path('pointage/models.py'); s=p.read_text(encoding='utf-8')
          marker="""    date_modification = models.DateTimeField(auto_now=True)\n\n    def __str__(self):\n"""
          repl="""    date_modification = models.DateTimeField(auto_now=True)\n    # Identifiant généré par le mobile pour rendre les retransmissions offline\n    # idempotentes. Nullable pour préserver les anciens pointages/web.\n    client_event_id = models.UUIDField(null=True, blank=True, unique=True, editable=False, db_index=True)\n\n    def __str__(self):\n"""
          if marker not in s: raise SystemExit('model marker not found')
          p.write_text(s.replace(marker,repl,1),encoding='utf-8')

          p=Path('pointage/services.py'); s=p.read_text(encoding='utf-8')
          old="""def process_scan(matricule: str, qr_token: str, site_id: int,\n                 mode: str = 'auto', force_new_garde: bool = False) -> dict:\n    \"\"\"Point d'entrée unique pour tout scan QR.\"\"\"\n    now = timezone.localtime(timezone.now())\n"""
          new="""def process_scan(matricule: str, qr_token: str, site_id: int,\n                 mode: str = 'auto', force_new_garde: bool = False,\n                 client_event_id=None, captured_at=None) -> dict:\n    \"\"\"Point d'entrée unique pour tout scan QR.\n\n    client_event_id permet aux clients mobiles offline de retransmettre un\n    événement sans créer un second pointage si la première requête a abouti.\n    captured_at représente l'instant de scan côté appareil ; il n'est accepté\n    que pour les événements mobiles synchronisés.\n    \"\"\"\n    if client_event_id:\n        try:\n            existing = Pointage.objects.filter(client_event_id=client_event_id).first()\n        except Exception:\n            existing = None\n        if existing:\n            scan = existing.scans.order_by('-timestamp').first()\n            if scan:\n                return {\n                    'status': 'success', 'code': scan.type_scan,\n                    'message': 'Scan déjà synchronisé (événement idempotent).',\n                    'data': _build_response_data(scan, existing, timezone.localtime(scan.timestamp)),\n                    'idempotent': True,\n                }\n    now = captured_at or timezone.localtime(timezone.now())\n    if timezone.is_naive(now):\n        now = timezone.make_aware(now, timezone.get_current_timezone())\n"""
          if old not in s: raise SystemExit('service signature not found')
          s=s.replace(old,new,1)
          old2="""    pointage, created = Pointage.objects.select_for_update().get_or_create(\n        employe=employe,\n        date_pointage=date_courante,\n        periode=periode,\n        defaults={'site': site, 'type_journee': 'normal'}\n    )\n"""
          new2="""    pointage, created = Pointage.objects.select_for_update().get_or_create(\n        employe=employe,\n        date_pointage=date_courante,\n        periode=periode,\n        defaults={'site': site, 'type_journee': 'normal', 'client_event_id': client_event_id}\n    )\n    if client_event_id and not pointage.client_event_id:\n        pointage.client_event_id = client_event_id\n        pointage.save(update_fields=['client_event_id', 'date_modification'])\n"""
          if old2 not in s: raise SystemExit('pointage get_or_create not found')
          p.write_text(s.replace(old2,new2,1),encoding='utf-8')

          p=Path('pointage/views_mobile.py'); s=p.read_text(encoding='utf-8')
          old="""        force_new_garde = _parse_bool(data.get('force_new', False), default=False)\n        if force_new_garde is None:\n"""
          new="""        force_new_garde = _parse_bool(data.get('force_new', False), default=False)\n        client_event_id = data.get('client_event_id')\n        captured_at_raw = data.get('captured_at')\n        captured_at = None\n        if client_event_id:\n            try:\n                import uuid\n                client_event_id = uuid.UUID(str(client_event_id))\n            except (ValueError, TypeError, AttributeError):\n                return JsonResponse({'status':'error','code':'CLIENT_EVENT_ID_INVALIDE','message':'client_event_id invalide.'}, status=400)\n            if captured_at_raw:\n                try:\n                    captured_at = datetime.fromisoformat(str(captured_at_raw).replace('Z', '+00:00'))\n                    captured_at = timezone.localtime(captured_at)\n                except (ValueError, TypeError):\n                    return JsonResponse({'status':'error','code':'CAPTURED_AT_INVALIDE','message':'captured_at invalide.'}, status=400)\n        if force_new_garde is None:\n"""
          if old not in s: raise SystemExit('mobile parse marker not found')
          s=s.replace(old,new,1)
          old2="""            force_new_garde=force_new_garde,\n        )\n"""
          new2="""            force_new_garde=force_new_garde,\n            client_event_id=client_event_id,\n            captured_at=captured_at,\n        )\n"""
          if old2 not in s: raise SystemExit('mobile process call not found')
          p.write_text(s.replace(old2,new2,1),encoding='utf-8')

          p=Path('mobile/ScanMobileApp/src/utils/constants.ts'); s=p.read_text(encoding='utf-8')
          s=s.replace("  CACHED_SITES_TIMESTAMP: 'cached_sites_timestamp',\n", "  CACHED_SITES_TIMESTAMP: 'cached_sites_timestamp',\n  PENDING_SCANS: 'pending_scans',\n")
          p.write_text(s,encoding='utf-8')

          p=Path('mobile/ScanMobileApp/src/services/api.ts'); s=p.read_text(encoding='utf-8')
          old="""  async recordScan(\n    employeeQr: string,\n    siteId: number,\n    mode: 'day' | 'night' = 'day',\n    options: {\n      forceNew?: boolean;\n    } = {}\n  ): Promise<any> {\n    const response = await api.post('/api/mobile/scan/record/', {\n      employee_qr: employeeQr,\n      site_id:     siteId,\n      mode,\n      force_new:   options.forceNew ?? false,\n    });\n    return response.data;\n  },\n"""
          new="""  async recordScan(\n    employeeQr: string,\n    siteId: number,\n    mode: 'day' | 'night' = 'day',\n    options: { forceNew?: boolean; } = {}\n  ): Promise<any> {\n    const payload = {\n      employee_qr: employeeQr, site_id: siteId, mode,\n      force_new: options.forceNew ?? false,\n    };\n    try {\n      const response = await api.post('/api/mobile/scan/record/', payload);\n      await this.syncPendingScans();\n      return response.data;\n    } catch (error: any) {\n      if (!error.response) {\n        const pending = JSON.parse(await AsyncStorage.getItem(STORAGE_KEYS.PENDING_SCANS) || '[]');\n        pending.push({\n          ...payload,\n          client_event_id: `${Date.now()}-${Math.random().toString(36).slice(2,10)}`,\n          captured_at: new Date().toISOString(),\n          queued_at: new Date().toISOString(),\n        });\n        await AsyncStorage.setItem(STORAGE_KEYS.PENDING_SCANS, JSON.stringify(pending));\n        return { status: 'success', code: 'SCAN_HORS_LIGNE', message: 'Scan enregistré localement. Il sera synchronisé dès le retour du réseau.', data: { offline: true } };\n      }\n      throw error;\n    }\n  },\n\n  async getPendingScanCount(): Promise<number> {\n    const raw = await AsyncStorage.getItem(STORAGE_KEYS.PENDING_SCANS);\n    return raw ? JSON.parse(raw).length : 0;\n  },\n\n  async syncPendingScans(): Promise<{ synced: number; remaining: number }> {\n    const raw = await AsyncStorage.getItem(STORAGE_KEYS.PENDING_SCANS);\n    const queue = raw ? JSON.parse(raw) : [];\n    if (!Array.isArray(queue) || queue.length === 0) return { synced: 0, remaining: 0 };\n    const remaining: any[] = []; let synced = 0;\n    for (const item of queue) {\n      try {\n        const response = await api.post('/api/mobile/scan/record/', item);\n        if (response.data?.status === 'success') synced++;\n        else remaining.push(item);\n      } catch (error: any) {\n        remaining.push(item);\n        if (!error.response) break;\n      }\n    }\n    await AsyncStorage.setItem(STORAGE_KEYS.PENDING_SCANS, JSON.stringify(remaining));\n    return { synced, remaining: remaining.length };\n  },\n"""
          if old not in s: raise SystemExit('api recordScan block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('mobile/ScanMobileApp/src/screens/SiteSelectionScreen.tsx'); s=p.read_text(encoding='utf-8')
          s=s.replace("    await loadSites()\n", "    await loadSites()\n    await apiService.syncPendingScans()\n", 1)
          p.write_text(s,encoding='utf-8')
      - name: Make migration and commit
        shell: bash
        run: |
          python manage.py makemigrations pointage --noinput
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pointage/models.py pointage/services.py pointage/views_mobile.py mobile/ScanMobileApp/src/utils/constants.ts mobile/ScanMobileApp/src/services/api.ts mobile/ScanMobileApp/src/screens/SiteSelectionScreen.tsx pointage/migrations
          git commit -m 'feat: support offline mobile scan queue with idempotent sync'
          git rm .github/workflows/implement-offline-scan.yml
          git commit -m 'chore: remove temporary offline implementation workflow'
          git push