name: Implement offline scan queue
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Patch backend and mobile
        shell: python
        run: |
          from pathlib import Path

          p=Path('pointage/models.py'); s=p.read_text(encoding='utf-8')
          marker="""    actif     = models.BooleanField(default=True)\n\n    def __str__(self):\n"""
          repl="""    actif     = models.BooleanField(default=True)\n    # UUID généré par le client pour rendre les retransmissions offline idempotentes.\n    client_event_id = models.UUIDField(null=True, blank=True, unique=True, editable=False, db_index=True)\n\n    def __str__(self):\n"""
          if marker not in s: raise SystemExit('Scan model marker not found')
          p.write_text(s.replace(marker,repl,1),encoding='utf-8')

          p=Path('pointage/services.py'); s=p.read_text(encoding='utf-8')
          old="""def process_scan(matricule: str, qr_token: str, site_id: int,\n                 mode: str = 'auto', force_new_garde: bool = False) -> dict:\n    \"\"\"Point d'entrée unique pour tout scan QR.\"\"\"\n    now = timezone.localtime(timezone.now())\n"""
          new="""def process_scan(matricule: str, qr_token: str, site_id: int,\n                 mode: str = 'auto', force_new_garde: bool = False,\n                 client_event_id=None, captured_at=None) -> dict:\n    \"\"\"Point d'entrée unique pour tout scan QR.\"\"\"\n    now = captured_at or timezone.localtime(timezone.now())\n    if timezone.is_naive(now):\n        now = timezone.make_aware(now, timezone.get_current_timezone())\n    if client_event_id:\n        existing_scan = Scan.objects.select_related('employe', 'site', 'pointage').filter(client_event_id=client_event_id).first()\n        if existing_scan:\n            pointage = existing_scan.pointage\n            data = _build_response_data(existing_scan, pointage, timezone.localtime(existing_scan.timestamp)) if pointage else None\n            return {'status':'success','code':existing_scan.type_scan,'message':'Scan déjà synchronisé (événement idempotent).','data':data,'idempotent':True}\n"""
          if old not in s: raise SystemExit('service signature marker not found')
          s=s.replace(old,new,1)
          s=s.replace("return _process_garde(employe, site, now, force_new=force_new_garde)", "return _process_garde(employe, site, now, force_new=force_new_garde, client_event_id=client_event_id)", 1)
          s=s.replace("return _process_normal(employe, site, now)", "return _process_normal(employe, site, now, client_event_id=client_event_id)", 1)
          s=s.replace("def _process_garde(employe, site, now, force_new=False):", "def _process_garde(employe, site, now, force_new=False, client_event_id=None):", 1)
          s=s.replace("def _process_normal(employe, site, now):", "def _process_normal(employe, site, now, client_event_id=None):", 1)
          s=s.replace("return _apply_scan_decision(decision, employe=employe, site=site, now=now)", "return _apply_scan_decision(decision, employe=employe, site=site, now=now, client_event_id=client_event_id)", 1)
          s=s.replace("def _apply_scan_decision(decision: ScanDecision, employe: Employe, site: Site, now) -> dict:", "def _apply_scan_decision(decision: ScanDecision, employe: Employe, site: Site, now, client_event_id=None) -> dict:", 1)
          s=s.replace("type_scan='fin_garde',\n            pointage=garde_en_cours", "type_scan='fin_garde',\n            pointage=garde_en_cours,\n            client_event_id=client_event_id", 1)
          s=s.replace("type_scan='debut_garde',\n            pointage=garde_planifiee", "type_scan='debut_garde',\n            pointage=garde_planifiee,\n            client_event_id=client_event_id", 1)
          s=s.replace("type_scan=type_scan,\n        pointage=pointage", "type_scan=type_scan,\n        pointage=pointage,\n        client_event_id=client_event_id", 1)
          p.write_text(s,encoding='utf-8')

          p=Path('pointage/views_mobile.py'); s=p.read_text(encoding='utf-8')
          old="""        force_new_garde = _parse_bool(data.get('force_new', False), default=False)\n        if force_new_garde is None:\n"""
          new="""        force_new_garde = _parse_bool(data.get('force_new', False), default=False)\n        client_event_id = data.get('client_event_id')\n        captured_at_raw = data.get('captured_at')\n        captured_at = None\n        if client_event_id:\n            try: client_event_id = uuid.UUID(str(client_event_id))\n            except (ValueError, TypeError, AttributeError):\n                return JsonResponse({'status':'error','code':'CLIENT_EVENT_ID_INVALIDE','message':'client_event_id invalide.'}, status=400)\n        if captured_at_raw:\n            try:\n                captured_at = datetime.fromisoformat(str(captured_at_raw).replace('Z', '+00:00'))\n                if timezone.is_naive(captured_at): captured_at = timezone.make_aware(captured_at, timezone.get_current_timezone())\n                else: captured_at = timezone.localtime(captured_at)\n            except (ValueError, TypeError):\n                return JsonResponse({'status':'error','code':'CAPTURED_AT_INVALIDE','message':'captured_at invalide.'}, status=400)\n        if force_new_garde is None:\n"""
          if old not in s: raise SystemExit('mobile parse marker not found')
          s=s.replace(old,new,1)
          old2="""            force_new_garde=force_new_garde,\n        )\n"""
          new2="""            force_new_garde=force_new_garde,\n            client_event_id=client_event_id,\n            captured_at=captured_at,\n        )\n"""
          if old2 not in s: raise SystemExit('mobile process call marker not found')
          p.write_text(s.replace(old2,new2,1),encoding='utf-8')

          p=Path('mobile/ScanMobileApp/src/utils/constants.ts'); s=p.read_text(encoding='utf-8')
          if "PENDING_SCANS:" not in s: s=s.replace("  CACHED_SITES_TIMESTAMP: 'cached_sites_timestamp',\n", "  CACHED_SITES_TIMESTAMP: 'cached_sites_timestamp',\n  PENDING_SCANS: 'pending_scans',\n")
          p.write_text(s,encoding='utf-8')

          p=Path('mobile/ScanMobileApp/src/services/api.ts'); s=p.read_text(encoding='utf-8')
          old_start="""  async recordScan(\n    employeeQr: string,\n    siteId: number,\n    mode: 'day' | 'night' = 'day',\n    options: {\n      forceNew?: boolean;\n    } = {}\n  ): Promise<any> {\n"""
          start=s.find(old_start)
          if start < 0: raise SystemExit('api recordScan start not found')
          end=s.find("\n  async ", start + len(old_start))
          if end < 0: raise SystemExit('api recordScan end not found')
          block="""  async recordScan(\n    employeeQr: string, siteId: number, mode: 'day' | 'night' = 'day',\n    options: { forceNew?: boolean; } = {}\n  ): Promise<any> {\n    const uuidv4 = (): string => {\n      const bytes = Array.from({ length: 16 }, () => Math.floor(Math.random() * 256));\n      bytes[6] = (bytes[6] & 0x0f) | 0x40; bytes[8] = (bytes[8] & 0x3f) | 0x80;\n      const hex = bytes.map(b => b.toString(16).padStart(2, '0')).join('');\n      return `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`;\n    };\n    const payload = { employee_qr: employeeQr, site_id: siteId, mode, force_new: options.forceNew ?? false, client_event_id: uuidv4(), captured_at: new Date().toISOString() };\n    try {\n      const response = await api.post('/api/mobile/scan/record/', payload);\n      await this.syncPendingScans(); return response.data;\n    } catch (error: any) {\n      if (!error.response) {\n        const raw = await AsyncStorage.getItem(STORAGE_KEYS.PENDING_SCANS);\n        const pending = raw ? JSON.parse(raw) : []; pending.push(payload);\n        await AsyncStorage.setItem(STORAGE_KEYS.PENDING_SCANS, JSON.stringify(pending));\n        return { status: 'success', code: 'SCAN_HORS_LIGNE', message: 'Scan enregistré localement. Il sera synchronisé dès le retour du réseau.', data: { offline: true } };\n      }\n      throw error;\n    }\n  },\n\n  async getPendingScanCount(): Promise<number> {\n    const raw = await AsyncStorage.getItem(STORAGE_KEYS.PENDING_SCANS); const queue = raw ? JSON.parse(raw) : [];\n    return Array.isArray(queue) ? queue.length : 0;\n  },\n\n  async syncPendingScans(): Promise<{ synced: number; remaining: number }> {\n    const raw = await AsyncStorage.getItem(STORAGE_KEYS.PENDING_SCANS); const queue = raw ? JSON.parse(raw) : [];\n    if (!Array.isArray(queue) || queue.length === 0) return { synced: 0, remaining: 0 };\n    const remaining: any[] = []; let synced = 0;\n    for (const item of queue) {\n      try { const response = await api.post('/api/mobile/scan/record/', item); if (response.data?.status === 'success') synced++; else remaining.push(item); }\n      catch (error: any) { remaining.push(item); if (!error.response) break; }\n    }\n    await AsyncStorage.setItem(STORAGE_KEYS.PENDING_SCANS, JSON.stringify(remaining));\n    return { synced, remaining: remaining.length };\n  },\n"""
          p.write_text(s[:start] + block + s[end:], encoding='utf-8')

          p=Path('mobile/ScanMobileApp/src/screens/SiteSelectionScreen.tsx'); s=p.read_text(encoding='utf-8')
          if 'await apiService.syncPendingScans()' not in s: s=s.replace("    await loadSites()\n", "    await loadSites()\n    await apiService.syncPendingScans()\n", 1)
          p.write_text(s,encoding='utf-8')
      - name: Make migration and commit
        shell: bash
        env:
          SECRET_KEY: ci-offline-scan-test-key
          ADMIN_SECRET_CODE: ci-admin-secret
        run: |
          python manage.py makemigrations pointage --noinput
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pointage/models.py pointage/services.py pointage/views_mobile.py mobile/ScanMobileApp/src/utils/constants.ts mobile/ScanMobileApp/src/services/api.ts mobile/ScanMobileApp/src/screens/SiteSelectionScreen.tsx pointage/migrations
          git commit -m 'feat: support offline mobile scan queue with event idempotency'
          git rm .github/workflows/implement-offline-scan.yml
          git commit -m 'chore: remove temporary offline implementation workflow'
          git push
