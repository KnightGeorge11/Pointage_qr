name: Fix guard overnight visibility
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Patch guard visibility
        shell: python
        run: |
          from pathlib import Path

          # Web views: overnight open guards started yesterday must remain
          # visible today. Also make get_prochain_scan agree with mobile.
          p = Path('pointage/views.py')
          s = p.read_text(encoding='utf-8')
          old = """    gardes_en_cours = today_pointages.filter(\n        periode='nuit', type_journee='garde', heure_depart__isnull=True\n    ).count()"""
          new = """    gardes_en_cours = Pointage.objects.filter(\n        periode='nuit', type_journee='garde', heure_arrivee__isnull=False,\n        heure_depart__isnull=True,\n        date_pointage__gte=today - timedelta(days=1),\n        date_pointage__lte=today,\n    ).count()"""
          assert s.count(old) == 1, f'dashboard guard block count={s.count(old)}'
          s = s.replace(old, new)

          old = """    gardes_en_cours      = Pointage.objects.filter(\n        date_pointage=today, periode='nuit',\n        type_journee='garde', heure_depart__isnull=True\n    ).count()"""
          new = """    gardes_en_cours      = Pointage.objects.filter(\n        periode='nuit', type_journee='garde', heure_arrivee__isnull=False,\n        heure_depart__isnull=True,\n        date_pointage__gte=today - timedelta(days=1),\n        date_pointage__lte=today,\n    ).count()"""
          assert s.count(old) == 1, f'scanner guard block count={s.count(old)}'
          s = s.replace(old, new)

          old = """        if Pointage.objects.filter(employe=employe, date_pointage=today, periode='nuit', type_journee='garde', heure_depart__isnull=True).exists():\n            return Response({'prochain_scan': 'fin_garde',   'type': 'garde',    'message': 'Fin de garde attendue'})\n        if Pointage.objects.filter(employe=employe, date_pointage=today, periode='nuit', type_journee='garde', heure_arrivee__isnull=True).exists():"""
          new = """        if Pointage.objects.filter(\n            employe=employe, periode='nuit', type_journee='garde',\n            heure_arrivee__isnull=False, heure_depart__isnull=True,\n            date_pointage__gte=today - timedelta(days=1),\n            date_pointage__lte=today,\n        ).exists():\n            return Response({'prochain_scan': 'fin_garde', 'type': 'garde', 'message': 'Fin de garde attendue'})\n        if Pointage.objects.filter(\n            employe=employe, date_pointage=today, periode='nuit',\n            type_journee='garde', heure_arrivee__isnull=True, heure_depart__isnull=True\n        ).exists():"""
          assert s.count(old) == 1, f'get_prochain_scan block count={s.count(old)}'
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          # Shared dashboard context: same overnight definition.
          p = Path('pointage/context_processors.py')
          s = p.read_text(encoding='utf-8')
          old = """    gardes_en_cours = Pointage.objects.filter(\n        date_pointage=today, \n        periode='nuit',\n        type_journee='garde', \n        heure_depart__isnull=True\n    ).count()"""
          new = """    gardes_en_cours = Pointage.objects.filter(\n        periode='nuit',\n        type_journee='garde',\n        heure_arrivee__isnull=False,\n        heure_depart__isnull=True,\n        date_pointage__gte=today - timedelta(days=1),\n        date_pointage__lte=today,\n    ).count()"""
          assert s.count(old) == 1, f'context guard block count={s.count(old)}'
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          # Keep this temporary workflow out of the repository after use.
          wf = Path('.github/workflows/fix-guard-overnight-views.yml')
          if wf.exists():
              wf.unlink()

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pointage/views.py pointage/context_processors.py .github/workflows/fix-guard-overnight-views.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix overnight guard visibility and next scan"
          git push origin main
