name: Fix overnight history and export v5
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch business rules, tests and offline queue
        shell: python
        run: |
          from pathlib import Path

          # 1) A normal scan is inside a working period, not inside the lunch break.
          p = Path('pointage/domain.py')
          s = p.read_text(encoding='utf-8')
          old = '''    def is_within_global_hours(self, current_time: time) -> bool:\n        """Vérifie si on est entre l'ouverture matin et fermeture après-midi.\n        \n        Inclut la tolérance avant et après.\n        \n        Retour\n        ------\n        bool : True si l'heure est acceptée globalement\n        """\n        today = date.today()\n        now_dt = datetime.combine(today, current_time)\n        open_dt = datetime.combine(today, self.morning_window.open_time) - self.tolerance\n        close_dt = datetime.combine(today, self.afternoon_window.close_time) + self.tolerance\n        \n        return open_dt <= now_dt <= close_dt\n'''
          new = '''    def is_within_global_hours(self, current_time: time) -> bool:\n        """Vérifie si l'heure appartient à une période de travail normale.\n\n        La tolérance s'applique uniquement autour des limites extérieures\n        (avant l'ouverture du matin et après la fermeture de l'après-midi).\n        L'intervalle 12:00-13:00 reste une pause et ne doit pas être considéré\n        comme une plage globale valide.\n        """\n        today = date.today()\n        now_dt = datetime.combine(today, current_time)\n        morning_open = datetime.combine(today, self.morning_window.open_time) - self.tolerance\n        morning_close = datetime.combine(today, self.morning_window.close_time)\n        afternoon_open = datetime.combine(today, self.afternoon_window.open_time)\n        afternoon_close = datetime.combine(today, self.afternoon_window.close_time) + self.tolerance\n\n        return (morning_open <= now_dt <= morning_close) or (afternoon_open <= now_dt <= afternoon_close)\n'''
          if old not in s:
              raise SystemExit('domain schedule block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # 2) Guard tests must select the actual guard, not the next-day empty planning row.
          p = Path('pointage/tests/test_garde_minuit.py')
          s = p.read_text(encoding='utf-8')
          old_line = "Pointage.objects.get(employe=self.employe, periode='nuit')"
          new_line = "Pointage.objects.get(employe=self.employe, periode='nuit', heure_arrivee__isnull=False)"
          count = s.count(old_line)
          if count != 3:
              raise SystemExit(f'expected 3 ambiguous guard lookups, found {count}')
          s = s.replace(old_line, new_line)
          p.write_text(s, encoding='utf-8')

          # 3) force_new must refuse a previous-day open guard; update the stale API test.
          p = Path('pointage/tests/test_pointage_serializer_process_scan.py')
          s = p.read_text(encoding='utf-8')
          old = '''    def test_force_new_via_api_pointages_ignore_garde_oubliee(self):\n        avant_hier = date(2026, 8, 8)\n        Pointage.objects.create(employe=self.employe, site=self.site, date_pointage=avant_hier, periode="nuit", type_journee="garde", statut="absent")\n        with patch("pointage.services.timezone.now", return_value=_aware(avant_hier, 20, 0)):\n            self._post_pointages_api(extra={"periode": "nuit", "type_journee": "garde"})\n\n        aujourdhui = date(2026, 8, 10)\n        with patch("pointage.services.timezone.now", return_value=_aware(aujourdhui, 20, 0)):\n            response = self._post_pointages_api(\n                extra={"periode": "nuit", "type_journee": "garde", "force_new": True}\n            )\n\n        assert response.status_code == 201, response.content\n        assert Pointage.objects.filter(\n            employe=self.employe, periode="nuit", date_pointage=aujourdhui\n        ).exists()\n'''
          new = '''    def test_force_new_via_api_pointages_refuse_garde_anterieure_ouverte(self):\n        avant_hier = date(2026, 8, 8)\n        Pointage.objects.create(employe=self.employe, site=self.site, date_pointage=avant_hier, periode="nuit", type_journee="garde", statut="absent")\n        with patch("pointage.services.timezone.now", return_value=_aware(avant_hier, 20, 0)):\n            debut = self._post_pointages_api(extra={"periode": "nuit", "type_journee": "garde"})\n        assert debut.status_code == 201, debut.content\n\n        aujourdhui = date(2026, 8, 10)\n        with patch("pointage.services.timezone.now", return_value=_aware(aujourdhui, 20, 0)):\n            response = self._post_pointages_api(\n                extra={"periode": "nuit", "type_journee": "garde", "force_new": True}\n            )\n\n        assert response.status_code == 400, response.content\n        assert response.json()["code"] == "GARDE_PRECEDENTE_NON_CLOTUREE"\n        assert not Pointage.objects.filter(\n            employe=self.employe, periode="nuit", date_pointage=aujourdhui\n        ).exists()\n'''
          if old not in s:
              raise SystemExit('stale force_new API test block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # 4) Re-check idempotency after the employee row lock to close the concurrent-request race.
          p = Path('pointage/services.py')
          s = p.read_text(encoding='utf-8')
          needle = '''    with transaction.atomic():\n        employe = Employe.objects.select_for_update().get(pk=employe.pk)\n\n        if not employe.actif:\n'''
          replacement = '''    with transaction.atomic():\n        employe = Employe.objects.select_for_update().get(pk=employe.pk)\n\n        # The first lookup is a fast path. This second lookup is mandatory\n        # after locking the employee: two concurrent requests can otherwise\n        # both pass the fast path before either Scan is committed.\n        if client_event_id:\n            existing_scan = Scan.objects.select_related('employe', 'site', 'pointage').filter(\n                client_event_id=client_event_id\n            ).first()\n            if existing_scan:\n                pointage = existing_scan.pointage\n                data = _build_response_data(\n                    existing_scan, pointage, timezone.localtime(existing_scan.timestamp)\n                ) if pointage else None\n                return {\n                    'status': 'success',\n                    'code': existing_scan.type_scan,\n                    'message': 'Scan déjà synchronisé (événement idempotent).',\n                    'data': data,\n                    'idempotent': True,\n                }\n\n        if not employe.actif:\n'''
          if needle not in s:
              raise SystemExit('services lock block not found')
          p.write_text(s.replace(needle, replacement, 1), encoding='utf-8')

          # 5) Do not retry permanent 4xx business rejections forever. Keep auth,
          # rate-limit, conflict, timeout and server/network failures for retry.
          p = Path('mobile/ScanMobileApp/src/services/api.ts')
          s = p.read_text(encoding='utf-8')
          old = '''      }\n      catch (error: any) { remaining.push(item); if (!error.response) break; }\n    }\n'''
          new = '''      }\n      catch (error: any) {\n        if (!error.response) {\n          remaining.push(item);\n          break;\n        }\n        const status = error.response.status;\n        const retryable = status === 401 || status === 408 || status === 409 || status === 429 || status >= 500;\n        if (retryable) {\n          remaining.push(item);\n          break;\n        }\n        // Permanent business/validation rejection: do not retry the same\n        // offline event forever. It has reached the server and was rejected.\n      }\n    }\n'''
          if old not in s:
              raise SystemExit('offline queue catch block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          print('All patches applied.')
      - name: Run focused tests
        shell: bash
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: 'False'
          ALLOWED_HOSTS: localhost,127.0.0.1
          DB_NAME: pointage_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          ADMIN_SECRET_CODE: ci-admin-secret
        run: |
          python -m pip install -r requirements.txt
          python manage.py test pointage.tests.test_garde_minuit pointage.tests.test_horaires_regression pointage.tests.test_pointage_serializer_process_scan
      - name: Commit and remove
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pointage/domain.py pointage/services.py pointage/tests/test_garde_minuit.py pointage/tests/test_pointage_serializer_process_scan.py mobile/ScanMobileApp/src/services/api.ts
          git commit -m 'fix: complete offline scan regressions and queue handling'
          git rm .github/workflows/fix-history-export-v5.yml
          git commit -m 'chore: remove temporary patch workflow'
          git push