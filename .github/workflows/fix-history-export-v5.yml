name: Fix overnight history and export v5
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch filters
        shell: python
        run: |
          from pathlib import Path
          p=Path('pointage/views.py'); s=p.read_text(encoding='utf-8')
          old="""        if date_debut:
            queryset = queryset.filter(
                Q(date_pointage__gte=date_debut) | Q(periode='nuit', date_depart__gte=date_debut)
            )
        if date_fin:
            queryset = queryset.filter(
                Q(date_pointage__lte=date_fin) | Q(periode='nuit', date_depart__lte=date_fin)
            )
"""
          new="""        if date_debut and date_fin:
            queryset = queryset.filter(
                Q(periode='nuit', date_pointage__lte=date_fin)
                & (Q(date_depart__isnull=True) | Q(date_depart__gte=date_debut))
                | Q(~Q(periode='nuit'), date_pointage__gte=date_debut, date_pointage__lte=date_fin)
            )
        elif date_debut:
            queryset = queryset.filter(
                Q(periode='nuit') & (Q(date_depart__isnull=True) | Q(date_depart__gte=date_debut))
                | Q(~Q(periode='nuit'), date_pointage__gte=date_debut)
            )
        elif date_fin:
            queryset = queryset.filter(date_pointage__lte=date_fin)
"""
          if old in s: s=s.replace(old,new,1)
          else: raise SystemExit('history filter not found')
          old2="""        qs = Pointage.objects.filter(
            date_pointage__gte=date_debut,
            date_pointage__lte=date_fin
        ).select_related('employe', 'site', 'employe__poste').order_by(
"""
          new2="""        qs = Pointage.objects.filter(
            Q(periode='nuit', date_pointage__lte=date_fin)
            & (Q(date_depart__isnull=True) | Q(date_depart__gte=date_debut))
            | Q(~Q(periode='nuit'), date_pointage__gte=date_debut, date_pointage__lte=date_fin)
        ).select_related('employe', 'site', 'employe__poste').order_by(
"""
          if old2 in s: s=s.replace(old2,new2,1)
          else: raise SystemExit('export filter not found')
          p.write_text(s,encoding='utf-8')
      - name: Commit and remove
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pointage/views.py
          git commit -m 'fix: include overnight guards in history and export' || true
          git rm .github/workflows/fix-history-export-v5.yml
          git commit -m 'chore: remove temporary history export workflow'
          git push