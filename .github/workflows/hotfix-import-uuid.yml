name: Hotfix mobile UUID import

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add missing UUID import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('pointage/views_mobile.py')
          text = path.read_text(encoding='utf-8')
          if '\nimport uuid\n' not in text:
              text = text.replace('import logging\n', 'import logging\nimport uuid\n', 1)
              path.write_text(text, encoding='utf-8')
          else:
              print('uuid import already present')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pointage/views_mobile.py
          git diff --cached --quiet || git commit -m 'fix: import uuid in mobile scan API'
          git push

# Trigger validation run after workflow installation.
