name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pointage_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pointage_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-key
      DEBUG: "False"
      # CI appelle Django en HTTP sur localhost : ne pas forcer une
      # redirection HTTPS, sinon toutes les vues/API renvoient 301 avant
      # d'atteindre leur logique. En production, la valeur est explicitement
      # activée dans l'environnement de déploiement.
      SECURE_SSL_REDIRECT: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DB_NAME: pointage_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      ADMIN_SECRET_CODE: ci-admin-secret

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Django system checks
        run: python manage.py check

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run tests (pytest)
        # ATTENTION : ne jamais revenir à `python manage.py test` ici.
        # Une partie de la suite (test_domain.py, test_state_machine.py —
        # précisément les tests de la logique figée/immuable du projet)
        # est écrite en style pytest pur (fonctions test_xxx sans classe
        # unittest.TestCase) et n'est PAS découverte par le test runner
        # Django. Constat du 10/09/2026 : manage.py test ne trouvait que
        # 288/353 tests, en silence, sans erreur ni avertissement — donc
        # le CI donnait un feu vert en ayant sauté 65 tests, dont TOUTE
        # la couverture de domain.py/state_machine.py.
        run: python -m pytest pointage/tests/ -v

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/ScanMobileApp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/ScanMobileApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit
