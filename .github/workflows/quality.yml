name: Project quality

on:
  push:
    branches: [main, audit-final-2026-09]
  pull_request:
    branches: [main]

jobs:
  django:
    name: Django checks and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pointage_qr
          POSTGRES_USER: pointage
          POSTGRES_PASSWORD: pointage_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pointage -d pointage_qr"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      SECRET_KEY: ci-only-secret-key-not-for-production
      ADMIN_SECRET_CODE: ci-only-admin-secret
      DEBUG: "False"
      DB_NAME: pointage_qr
      DB_USER: pointage
      DB_PASSWORD: pointage_test_password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CORS_EXTRA_ORIGINS: http://localhost:8000
      CSRF_TRUSTED_ORIGINS: http://localhost:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run test suite
        run: python manage.py test

  mobile:
    name: Mobile TypeScript check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/ScanMobileApp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/ScanMobileApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit
