name: Apply mobile login throttle

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile login view
        run: |
          python -c "from pathlib import Path; p=Path('pointage/views_mobile.py'); s=p.read_text(); s=s.replace('from .services import process_scan, parse_qr_data', 'from .services import process_scan, parse_qr_data\nfrom .mobile_throttle import MobileLoginRateThrottle', 1); s=s.replace('    permission_classes = [AllowAny]\n\n    def post(self, request):', '    permission_classes = [AllowAny]\n    throttle_classes = [MobileLoginRateThrottle]\n\n    def post(self, request):', 1); p.write_text(s)"
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pointage/views_mobile.py
          git diff --cached --quiet || git commit -m 'security: rate limit mobile login attempts'
          git push
