name: Fix guard history v3
on:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch guard history
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pointage/views.py')
          s = p.read_text()
          old = """        if date_debut:\n            queryset = queryset.filter(date_pointage__gte=date_debut)\n        if date_fin:\n            queryset = queryset.filter(date_pointage__lte=date_fin)\n"""
          new = """        if date_debut:\n            queryset = queryset.filter(\n                Q(date_pointage__gte=date_debut)\n                | Q(periode='nuit', date_depart__gte=date_debut)\n                | Q(periode='nuit', date_pointage__lt=date_debut, date_depart__isnull=True)\n            )\n        if date_fin:\n            queryset = queryset.filter(\n                Q(date_pointage__lte=date_fin)\n                | Q(periode='nuit', date_depart__lte=date_fin)\n            )\n"""
          if old not in s:
              raise SystemExit('views.py target not found')
          if 'from django.db.models import Q' not in s:
              marker = 'from django.shortcuts import'
              idx = s.find(marker)
              if idx == -1: raise SystemExit('views.py import marker not found')
              line_end = s.find('\n', idx)
              s = s[:line_end+1] + 'from django.db.models import Q\n' + s[line_end+1:]
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('pointage/views_mobile.py')
          s = p.read_text()
          if 'from django.db.models import Q' not in s:
              marker = 'from django.http import JsonResponse'
              idx = s.find(marker)
              if idx == -1: raise SystemExit('views_mobile import marker not found')
              line_end = s.find('\n', idx)
              s = s[:line_end+1] + 'from django.db.models import Q\n' + s[line_end+1:]
          old = """        pointages = Pointage.objects.filter(\n            employe=employe, date_pointage=date_courante\n        ).select_related('site').order_by('date_pointage', 'periode')\n"""
          new = """        pointages = Pointage.objects.filter(\n            Q(employe=employe, date_pointage=date_courante)\n            | Q(employe=employe, periode='nuit', date_depart=date_courante)\n        ).select_related('site').order_by('date_pointage', 'periode')\n"""
          if old not in s:
              raise SystemExit('views_mobile.py target not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pointage/views.py pointage/views_mobile.py
          git commit -m "fix: include overnight guards in history filters"
          git push
          git rm .github/workflows/fix-guard-history-v3.yml
          git commit -m "chore: remove temporary guard history workflow"
          git push
