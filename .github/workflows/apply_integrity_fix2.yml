name: Apply attendance integrity fix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('pointage/views.py')
          s = p.read_text()
          old = '''            pointage_existant = Pointage.objects.filter(\n                employe_id=employe_id, date_pointage=date_pointage, periode=periode\n            ).first()'''
          new = '''            pointage_existant = Pointage.objects.select_for_update().filter(\n                employe_id=employe_id, date_pointage=date_pointage, periode=periode\n            ).first()'''
          assert old in s, 'views.py correction lookup not found'
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('pointage/admin.py')
          s = p.read_text()
          old = '''            pointage_existant = Pointage.objects.filter(\n                employe_id=employe_id, date_pointage=date_pointage, periode=periode\n            ).first()'''
          new = '''            pointage_existant = Pointage.objects.select_for_update().filter(\n                employe_id=employe_id, date_pointage=date_pointage, periode=periode\n            ).first()'''
          assert old in s, 'admin.py correction lookup not found'
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          python -m compileall -q pointage
      - name: Verify fix
        run: |
          grep -n -A3 -B1 'pointage_existant = Pointage.objects.select_for_update' pointage/views.py
          grep -n -A3 -B1 'pointage_existant = Pointage.objects.select_for_update' pointage/admin.py
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pointage/views.py pointage/admin.py
          git diff --cached --check
          git commit -m 'fix: lock pointage during RH correction' || true
          git push origin main
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/apply_integrity_fix2.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove temporary integrity workflow' || true
          git push origin main || true
